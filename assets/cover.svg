<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Explainable Quran and Hadith Retrieval</title>
  <desc id="desc">Bilingual Arabic and English hybrid semantic search</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
